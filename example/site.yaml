title: Example Photographer

# Navigation order. A folder under galleries/ that is not listed here is not
# published; `npm run dev` shows it as a draft (see galleries/colour-slides).
galleries:
  - american-photographs
  - main-street
  - pairs
  - plant-forms
  - china-1946
  - worthington

# Galleries reachable only at /p/<key>/ and linked from nowhere. Make keys
# with `npm run new-key`; anyone with site.yaml has the links, so keep it
# private. (This example key is public, being in the repository.)
private:
  work-in-progress: K7bq2mWfXv0aT9cLr3yNdQ

pages:
  - about.md
  - contact.md

footer: Sample photographs are in the public domain, from the Library of Congress, the J. Paul Getty Museum and The Metropolitan Museum of Art via Wikimedia Commons.

# Defaults for every gallery; a gallery or image can override them.
defaults:
  theme: light
  view: sequence
  border: none

images:
  max: 2560
