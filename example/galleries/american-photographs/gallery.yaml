title: American Photographs
year: 1929–1943
cover: times-square.jpg
intro: |
  Photographs from the 1930s and early 1940s, most of them made for the
  Farm Security Administration and the Office of War Information. The two
  Walker Evans prints are in the J. Paul Getty Museum.
