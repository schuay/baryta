# Build:  docker compose run --rm build
# Serve:  docker compose up -d web
# BARYTA_CONTENT points at the content directory (site.yaml, galleries/).
name: baryta

services:
  build:
    build: .
    profiles: [build]
    volumes:
      - ${BARYTA_CONTENT:-./example}:/content:ro
      - cache:/cache
      - site:/site

  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BARYTA_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/site:ro

volumes:
  cache:
  site:
